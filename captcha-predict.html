<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

    <script type="module">
        import { Client } from 'https://cdn.jsdelivr.net/npm/@gradio/client@1.14.2/dist/index.min.js';

        const imageInput = document.getElementById('imageInput');
        const dropZone = document.getElementById('dropZone');
        const preview = document.getElementById('preview');
        const processButton = document.getElementById('processButton');
        const processing = document.getElementById('processing');
        const result = document.getElementById('result');
        const error = document.getElementById('error');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');

        // Drag and drop handling
        dropZone.addEventListener('click', () => imageInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                imageInput.files = e.dataTransfer.files;
                handleImage(file);
            }
        });

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleImage(file);
        });

        function handleImage(file) {
            preview.src = URL.createObjectURL(file);
            preview.classList.remove('hidden');
            processButton.disabled = false;
        }

        processButton.addEventListener('click', async () => {
            const file = imageInput.files[0];
            if (!file) return;

            processButton.disabled = true;
            processing.classList.remove('hidden');
            result.classList.add('hidden');
            error.classList.add('hidden');

            try {
                console.log('Connecting to Gradio API...');
                const client = await Client.connect('mrbob12/CaptchaPredict', {
                    return_format: 'json'
                });
                console.log('Connected to Gradio API');

                console.log('Sending prediction request...');
                const prediction = await client.predict('/predict', {
                    image: file
                });
                console.log('Prediction response:', prediction);

                if (prediction && prediction.data && prediction.data[0]) {
                    result.textContent = `Predicted Text: ${prediction.data[0]}`;
                    result.classList.remove('hidden');
                } else {
                    throw new Error('No valid prediction data received');
                }
            } catch (err) {
                console.error('Error details:', err);
                error.textContent = `Error: ${err.message}`;
                error.classList.remove('hidden');
            } finally {
                processButton.disabled = false;
                processing.classList.add('hidden');
            }
        });
    </script>
